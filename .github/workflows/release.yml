name: Release Obsidian plugin

# Only plain x.y.z tags trigger this. Tags like daemon-0.2.0 or v1.0.0 do not,
# so other packages can version independently.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/obsidian-lint/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix tools/obsidian-lint

      - name: Verify manifest and tag
        run: node scripts/check-manifest.mjs

      # Same rules as the community review: never publish a release the bot will reject.
      - name: Test (includes Obsidian review rules)
        run: npm test

      - name: Build plugin
        run: npm run build -w apps/plugin

      - name: Stage release assets
        run: |
          mkdir -p release
          cp apps/plugin/main.js apps/plugin/manifest.json apps/plugin/styles.css release/
          # Obsidian fetches these by exact filename, so no extra files, no nesting.
          ls -la release

      - name: Generate artifact attestation
        # Attestations need a public repo; this auto-skips while the repo is private.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes="Carbon Sync $tag" \
            release/main.js release/manifest.json release/styles.css
